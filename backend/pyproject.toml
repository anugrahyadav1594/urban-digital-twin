[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-digital-twin-backend"
version = "0.1.0"
description = "Backend and AI orchestration layer for the Urban Digital Twin"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "httpx>=0.28,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
